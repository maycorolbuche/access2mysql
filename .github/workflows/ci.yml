name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: CI / Validação
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Obter código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Configurar Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validar sintaxe
        run: |
          node --check app.js
          node --check helpers/dbconnect.js
          node --check helpers/export.js
      - name: Verificar política de instalação
        run: node --test tests/install-policy.test.mjs
      - name: Consultar avisos de dependências (informativo)
        continue-on-error: true
        run: npm audit --package-lock-only --ignore-scripts --omit=dev
